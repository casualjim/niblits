[package]
name = "text-chunking"
version = "0.1.2"
edition = "2024"
description = "Token-aware, multi-format text chunking library with language-aware semantic splitting"
authors = ["Slipstream Team"]
repository = "https://git.wagyu.icu/slipstream/text-chunking"
homepage = "https://git.wagyu.icu/slipstream"
publish = ["forgejo"]
keywords = ["text", "chunking", "parsing", "tokenization", "embeddings"]
categories = ["text-processing", "parsing", "algorithms", "asynchronous"]
readme = "README.md"
license = "none"

[package.metadata.release]
sign-commit = false
tag = false
registry = "forgejo"
# Add [ci skip] to commit messages to prevent CI triggers
pre-release-commit-message = "Release {{version}} [ci skip]"

[dependencies]
async-stream = "0.3.6"
async-tempfile = "0.7"
async-trait = "0.1"
blake3 = "1"

docx-parser = "0.1.1"
docx-rust = "=0.1.8"
eyre = "0.6"
futures = "0.3"
htmd = "0.3.2"

hyperpolyglot = { version = "0.1.7", registry = "forgejo" }
infer = "0.19.0"
oxidize-pdf = { version = "1.6" }
secrecy = { version = "0.10.3", features = ["serde"] }

serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.142"
tempfile = "3"
text-splitter = { version = "0.28", features = ["code", "tiktoken-rs", "tokenizers", "markdown"] }
thiserror = "2.0.17"
tiktoken-rs = "0.7"
tokenizers = { version = "0.22.1", default-features = false, features = ["esaxx_fast", "http", "onig"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = { version = "0.1.41" }
tree-sitter = "0.25"
tree-sitter-language = "0.1.5"
typed-builder = "0.23.0"

[build-dependencies]
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.142"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs"] }
