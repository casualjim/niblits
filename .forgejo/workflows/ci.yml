name: CI Build and Publish

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on:
      - docker
      - linux
      - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Cargo for Forgejo Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [registry]
          global-credential-providers = ["cargo:token"]
          [registries.forgejo]
          index = "sparse+https://git.wagyu.icu/api/packages/pkg/cargo/"
          EOF

      - name: Install mold linker and C++ libraries on Linux
        run: |
          # We need to ensure that all the C++ uses the same standard library
          # Install the same LLVM as the one used by the Zig toolchain
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" > /etc/apt/sources.list.d/llvm-20.list
          apt-get update
          apt-get install -y mold libssl-dev pkg-config libc++-20-dev libc++abi-20-dev clang-20
          ARCH=$(uname -m)
          echo "CXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV
          echo "CXXSTDLIB=c++" >> $GITHUB_ENV

          # Configure Rust to use clang with mold for linking
          RUSTFLAGS_VALUE="-C link-arg=-fuse-ld=mold"


          if [ "$ARCH" = "aarch64" ]; then
            if [[ ! -e /usr/lib/aarch64-linux-gnu/libc++.so ]] || [[ -L /usr/lib/aarch64-linux-gnu/libc++.so && ! -e /usr/lib/aarch64-linux-gnu/libc++.so ]]; then
              ln -sf /usr/lib/aarch64-linux-gnu/libc++.so.1 /usr/lib/aarch64-linux-gnu/libc++.so
            fi

            echo "Setting ARM64-specific environment variables"
            echo "CFLAGS=-I/usr/include -I/usr/include/aarch64-linux-gnu" >> $GITHUB_ENV
            RUSTFLAGS_VALUE="$RUSTFLAGS_VALUE -L/usr/lib/aarch64-linux-gnu"
          fi

          if [ -n "${RUSTFLAGS:-}" ]; then
            RUSTFLAGS_VALUE="${RUSTFLAGS} ${RUSTFLAGS_VALUE}"
          fi

          echo "RUSTFLAGS=$RUSTFLAGS_VALUE" >> $GITHUB_ENV
        shell: bash

      - name: Install tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
        shell: bash

      - name: Install mise
        uses: https://github.com/jdx/mise-action@v3
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
          CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRIES_FORGEJO_TOKEN }}"
        with:
          experimental: true
          install: true
          cache: false

      - name: Install npm dependencies
        run: bun install
        shell: bash

      - name: Run tests
        env:
          CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRIES_FORGEJO_TOKEN }}"
        run: |
          cargo nextest run --all-features --no-tests pass

      - name: Publish to Cargo Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRIES_FORGEJO_TOKEN }}"
        run: |
          git config --global user.email "mctest@wagyu.icu"
          git config --global user.name "Bob the Builder"
          cargo release patch --execute --no-confirm --all-features
